
services:
  app:
    image: ${ACR_LOGIN_SERVER}/croptrack:${IMAGE_TAG}

    # Map local port 3000 to container port 3000
    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=true

    restart: unless-stopped
