name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull rwigenza1davy/croptrack:latest
            docker stop croptrack || true
            docker rm croptrack || true
            docker run -d --name croptrack --restart unless-stopped -p 80:3000 rwigenza1davy/croptrack:latest
