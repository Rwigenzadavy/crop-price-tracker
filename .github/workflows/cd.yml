
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to private Azure VM
    runs-on: ubuntu-latest

    # Deploy only after a successful CI run caused by a push to main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      # 1. Check out exactly the commit that passed CI.
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # 2. Install Python and Ansible.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # 3. Install the collections declared by the repository.
      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            -r ansible/requirements.yml

      # 4. Configure SSH access through the jumpbox.
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          JUMPBOX_HOST: ${{ secrets.SSH_HOST }}
          JUMPBOX_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host jumpbox
            HostName $JUMPBOX_HOST
            User $JUMPBOX_USER
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            StrictHostKeyChecking yes

          Host croptrack-private
            HostName 10.0.2.4
            ProxyJump jumpbox
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

      # 5. Deploy the SHA-tagged image using the existing playbook.
      - name: Deploy CropTrack using Ansible
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          set -euo pipefail
          umask 077

          VARS_FILE=$(mktemp)
          trap 'rm -f "$VARS_FILE"' EXIT

          # Use Python's JSON serializer to safely handle special characters.
          python - "$VARS_FILE" <<'PY'
          import json
          import os
          import sys

          variables = {
              "acr_login_server": "acrcroptrackdevjnvnq.azurecr.io",
              "acr_username": os.environ["ACR_USERNAME"],
              "acr_password": os.environ["ACR_PASSWORD"],
              "image_tag": os.environ["IMAGE_TAG"],
              "db_password": os.environ["DB_PASSWORD"],
          }

          with open(sys.argv[1], "w") as file:
              json.dump(variables, file)
          PY

          # Use the repository inventory and existing site playbook.
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/site.yml \
            -e "@$VARS_FILE"

      # 6. The Ansible playbook must perform the actual health checks.
      # A successful Ansible run must mean deployment AND verification passed.
