
---
- name: Configure Azure VM and deploy CropTrack
  hosts: webservers
  become: true

  tasks:

    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - ufw
          - python3
          - python3-docker
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add official Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Pull published CropTrack Docker image
      community.docker.docker_image:
        name: "{{ app_image }}"
        source: pull

    - name: Deploy CropTrack container
      community.docker.docker_container:
        name: croptrack
        image: "{{ app_image }}"
        state: started
        restart_policy: unless-stopped
        pull: true
        published_ports:
          - "{{ app_port }}:3000"
        env:
          NODE_ENV: production
          PORT: "3000"

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Allow public HTTP traffic
      community.general.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Add authorized teammate SSH keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ teammate_public_keys }}"

    - name: Configure SSH hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-security-hardening.conf
        content: |
          PermitRootLogin no
          PubkeyAuthentication yes
          PermitEmptyPasswords no
          MaxAuthTries 3
        mode: '0644'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Check CropTrack health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ app_port }}/health
        method: GET
        status_code: 200
      register: health_check
      retries: 10
      delay: 5
      until: health_check.status == 200

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
