
---
- name: Configure Azure VM and deploy CropTrack
  hosts: webservers
  become: true

  vars:
    app_port: 3000
    deployment_dir: /opt/croptrack

  tasks:

    # ==========================================
    # 1. UPDATE UBUNTU AND INSTALL DEPENDENCIES
    # ==========================================

    - name: Update Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - ufw
          - python3
          - python3-docker
        state: present

    # ==========================================
    # 2. INSTALL DOCKER
    # ==========================================

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add official Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ==========================================
    # 3. PREPARE DEPLOYMENT DIRECTORY
    # ==========================================

    - name: Create CropTrack deployment directory
      ansible.builtin.file:
        path: "{{ deployment_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # ==========================================
    # 4. AUTHENTICATE TO AZURE CONTAINER REGISTRY
    # ==========================================

    - name: Log in to Azure Container Registry
      community.docker.docker_login:
        registry_url: "{{ acr_login_server }}"
        username: "{{ acr_username }}"
        password: "{{ acr_password }}"
        reauthorize: true
      no_log: true

    # ==========================================
    # 5. COPY DOCKER COMPOSE CONFIGURATION
    # ==========================================

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ deployment_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'

    # ==========================================
    # 6. CREATE ENVIRONMENT FILE
    # ==========================================

    - name: Create CropTrack environment file
      ansible.builtin.copy:
        dest: "{{ deployment_dir }}/.env"
        owner: root
        group: root
        mode: '0600'
        content: |
          ACR_LOGIN_SERVER={{ acr_login_server }}
          IMAGE_TAG={{ image_tag }}
          DB_HOST={{ db_host }}
          DB_PORT={{ db_port }}
          DB_NAME={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}
      no_log: true

    # ==========================================
    # 7. DEPLOY USING DOCKER COMPOSE
    # ==========================================

    - name: Deploy CropTrack using Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ deployment_dir }}"
        project_name: croptrack
        state: present
        pull: always
        wait: true
        wait_timeout: 120
      register: compose_result

    # ==========================================
    # 8. VERIFY APPLICATION AND DATABASE
    # ==========================================

    - name: Check CropTrack health endpoint # checkov:skip=CKV2_ANSIBLE_1:Localhost health check uses HTTP because it communicates only within the VM
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: health_check
      retries: 10
      delay: 5
      until:
        - health_check.status == 200
        - health_check.json.database == "connected"

    - name: Display successful deployment
      ansible.builtin.debug:
        msg: "CropTrack is running and database connection is successful!"
